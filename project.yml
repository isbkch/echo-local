name: EchoLocal

options:
  bundleIdPrefix: com.isbkch
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  KokoroSwift:
    # Coordinated Kokoro/Misaki patch for upstream kokoro-ios PR #29. Both
    # manifests must allow MLX 0.30.6 or SwiftPM resolves the broken 0.30.2.
    url: https://github.com/dakshaymehta/kokoro-ios.git
    revision: 411c4e8b6c813fbf2dd16bf7cb9b5362ab804e09
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: 0.30.6

targets:
  EchoLocal:
    type: application
    platform: macOS
    sources:
      - path: EchoLocal
        excludes:
          - Info.plist
          - EchoLocal.entitlements
    dependencies:
      - package: KokoroSwift
        product: KokoroSwift
        embed: true
      - package: MLXSwift
        product: MLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isbkch.echolocal
        PRODUCT_NAME: Echolocal
        PRODUCT_MODULE_NAME: EchoLocal
        SWIFT_VERSION: 5.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: EchoLocal/EchoLocal.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EchoLocal/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - EchoLocalTests
      gatherCoverageData: true

  EchoLocalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EchoLocalTests
    dependencies:
      - target: EchoLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isbkch.echolocal.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Echolocal.app/Contents/MacOS/Echolocal"
        BUNDLE_LOADER: "$(TEST_HOST)"
